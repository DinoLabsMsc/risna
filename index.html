<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halo dari Azril</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Outfit",sans-serif;}
html,body{
  height:100vh;
  width:100vw;
  background:linear-gradient(160deg,#000000,#2a0030,#4b0082);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#f5f3ff;
  text-align:center;
  overflow-x:hidden;
}
.avatar-container{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
  width:95%;
  max-width:700px;
}
.avatar-container img{
  width:180px;
  height:180px;
  border-radius:50%;
  border:3px solid #fff;
  box-shadow:0 5px 20px rgba(0,0,0,0.3);
  object-fit:cover;
  opacity:0;
  transform:translateY(20px);
  transition: all 0.4s ease-out;
}
.avatar-container img.show{
  opacity:1;
  transform:translateY(0);
}
.name-tag{
  font-weight:700;
  font-size:1.6rem;
  color:#fff;
  text-shadow:0 0 8px rgba(0,0,0,0.3);
  opacity:0;
  transform:translateY(10px);
  transition: all 0.4s ease-out;
}
.name-tag.show{
  opacity:1;
  transform:translateY(0);
}
.chat-bubble{
  background:rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  color:#fff;
  padding:20px 28px;
  border-radius:20px;
  width:100%;
  font-size:1.2rem;
  box-shadow:0 5px 12px rgba(0,0,0,0.2);
  text-align:center;
  position:relative;
  opacity:0;
  transition: opacity 0.3s ease-in-out;
  overflow-y:auto;
}
.chat-bubble.show{opacity:1;}
#chatText{display:block;word-wrap: break-word;}
#continueBtn{
  margin-top:25px;
  padding:16px 32px;
  font-size:1.2rem;
  font-weight:700;
  color:#fff;
  background:rgba(255,255,255,0.15);
  border:1px solid rgba(255,255,255,0.25);
  border-radius:16px;
  cursor:pointer;
  box-shadow:0 0 14px rgba(255,255,255,0.25);
  backdrop-filter: blur(10px);
  transform: scale(0);
  opacity:0;
  transition: all 0.3s ease-out;
}
#continueBtn.show{
  transform: scale(1);
  opacity:1;
  animation: pulseClick 1.2s infinite;
}
#continueBtn:hover{
  background:rgba(255,255,255,0.35);
  transform: scale(1.1);
}
@keyframes pulseClick{0%,100% {transform: scale(1);}50% {transform: scale(1.08);}}
.fadeOut{opacity:0 !important;transition: opacity 0.5s ease-out;}
#pullRefresh{
  position:absolute;
  top:10px;
  width:40px;
  height:40px;
  border:4px solid rgba(255,255,255,0.3);
  border-top-color:#fff;
  border-radius:50%;
  animation: spin 1s linear infinite;
  display:none;
  z-index:999;
}
@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="pullRefresh"></div>

<div class="avatar-container">
  <img src="https://i.imgur.com/71LMjZs.gif" alt="Avatar Azril" id="avatarImg">
  <div class="name-tag" id="nameTag">Azril</div>
  <div class="chat-bubble" id="chatBubble">
    <span id="chatText">Hallo ayang, kamu mau liat penjualan pulsa ya? yuk pilih Lanjut</span>
  </div>
  <button id="continueBtn">Lanjut</button>
</div>

<script>
const avatar = document.getElementById("avatarImg");
const nameTag = document.getElementById("nameTag");
const chatBubble = document.getElementById("chatBubble");
const continueBtn = document.getElementById("continueBtn");
const pull = document.getElementById("pullRefresh");

function initPage(){
  avatar.classList.add("show");
  nameTag.classList.add("show");
  chatBubble.classList.add("show");
  continueBtn.classList.add("show");
}

window.addEventListener("load", initPage);
window.addEventListener("pageshow", e=>{ if(e.persisted){ initPage(); } });

continueBtn.addEventListener("click", ()=>{
  avatar.classList.add("fadeOut");
  nameTag.classList.add("fadeOut");
  chatBubble.classList.add("fadeOut");
  continueBtn.classList.add("fadeOut");
  setTimeout(()=> window.location.href="provider.html",500); // ganti ke provider.html
});

// Pull-to-refresh
let startY=0,isPull=false;
document.addEventListener("touchstart", e=>{startY=e.touches[0].clientY;});
document.addEventListener("touchmove", e=>{
  let diff=e.touches[0].clientY-startY;
  if(diff>50){pull.style.display="block";isPull=true;}
});
document.addEventListener("touchend", e=>{
  if(isPull){location.reload();}
  pull.style.display="none";
  isPull=false;
});
</script>

</body>
</html>
