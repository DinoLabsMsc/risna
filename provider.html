<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaksi Dynotic</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Outfit",sans-serif;}
html,body{
  min-height:100%;
  width:100%;
  background:linear-gradient(160deg,#000000,#2a0030,#4b0082);
  display:flex;
  flex-direction:column;
  align-items:center;
  color:#f5f3ff;
  overflow-x:hidden;
}
h1{
  margin:20px 0;
  font-size:clamp(2rem,4vw,3rem);
  text-align:center;
  text-shadow:0 0 8px rgba(0,0,0,0.3);
}
.search-box{
  width:95%;
  max-width:1200px;
  border-radius:12px;
  padding:12px 20px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.15);
  margin-bottom:20px;
}
.search-box input{
  width:100%;
  border:none;
  outline:none;
  background:transparent;
  color:#fff;
  font-size:1.1rem;
  padding:8px 0;
}
.table-container{
  width:95%;
  max-width:1200px;
  flex-grow:1;
  overflow-x:auto;
}
table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  background:transparent;
}
th,td{
  padding:14px 10px;
  border:1px solid #fff;
  text-align:left;
  word-wrap:break-word;
  background:rgba(0,0,0,0.2);
  color:#fff;
}
th{
  background:rgba(0,0,0,0.4);
  font-weight:700;
  font-size:1.05rem;
}
td{
  background:rgba(0,0,0,0.2);
  font-size:1rem;
}
tr:hover td{
  background:rgba(0,0,0,0.35);
}
.no-result{
  text-align:center;
  margin-top:15px;
  color:#f0a;
  display:none;
}
.pagination{
  display:flex;
  justify-content:center;
  gap:12px;
  margin:15px 0 25px;
  flex-wrap:wrap;
}
.pagination button{
  cursor:pointer;
  padding:8px 18px;
  border-radius:12px;
  background: rgba(255,255,255,0.1);
  color:#fff;
  font-weight:600;
  border:1px solid rgba(255,255,255,0.25);
  transition: all 0.25s ease;
}
.pagination button:hover{
  background: rgba(255,255,255,0.3);
  transform: scale(1.05);
}
.pagination button:disabled{
  opacity:0.4;
  cursor:not-allowed;
  background: rgba(255,255,255,0.05);
}
footer{
  padding:12px 10px;
  font-size:0.85rem;
  color: rgba(255,255,255,0.6);
  text-align:center;
}

/* Loading Anime GIF */
#loadingAnime{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.85);
  display:flex;justify-content:center;align-items:center;
  flex-direction:column;
  z-index:9999;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.4s ease;
}
#loadingAnime img{
  width:130px;
  height:130px;
  margin-bottom:14px;
}
#loadingAnime span{
  font-size:1.4rem;
  color:#fff;
  font-weight:700;
}

/* Mobile Responsive */
@media (max-width:992px){
  th,td{
    font-size:0.9rem;
    padding:10px 6px;
  }
  .search-box{
    padding:10px 14px;
  }
  .pagination button{
    padding:6px 12px;
    font-size:0.85rem;
  }
}
@media (max-width:576px){
  th,td{
    font-size:0.8rem;
    padding:8px 4px;
  }
  .search-box input{
    font-size:0.9rem;
  }
}
</style>
</head>
<body>

<div id="loadingAnime">
  <img src="https://i.imgur.com/897ShGy.gif" alt="Anime Joget">
  <span>Loading...</span>
</div>

<h1>Daftar Transaksi</h1>
<div class="search-box">
  <input type="text" id="searchInput" placeholder="Cari berdasarkan ID, Provider, Produk...">
</div>

<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Provider</th>
        <th>Produk</th>
        <th>Harga Jual</th>
        <th>Laba</th>
        <th>Status</th>
        <th>Bukti Transaksi</th>
      </tr>
    </thead>
    <tbody id="transactionList">
      <!-- Data akan diambil dari provider.json -->
    </tbody>
  </table>
</div>

<p class="no-result" id="noResult">Data tidak ditemukan.</p>

<div class="pagination">
  <button id="prevBtn">Previous</button>
  <button id="nextBtn">Next</button>
</div>

<footer>© 2025 Dynotic ID</footer>

<script>
const itemsPerPage = 10;
let currentPage = 1;
let transactions = [];
let filteredTransactions = [];

const transactionList = document.getElementById('transactionList');
const searchInput = document.getElementById('searchInput');
const noResult = document.getElementById('noResult');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const loadingAnime = document.getElementById('loadingAnime');

// Load provider.json
async function loadData(){
  try{
    const response = await fetch('provider.json');
    transactions = await response.json();
    filteredTransactions = [...transactions];
    renderTransactions();
  }catch(err){
    console.error("Gagal load provider.json", err);
  }
}

function renderTransactions(){
  transactionList.innerHTML = '';
  const start = (currentPage-1)*itemsPerPage;
  const end = start + itemsPerPage;
  const pageItems = filteredTransactions.slice(start,end);
  noResult.style.display = pageItems.length===0?'block':'none';

  pageItems.forEach(t=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${t.id || ''}</td>
      <td>${t.provider || ''}</td>
      <td>${t.produk || ''}</td>
      <td>${t.harga || ''}</td>
      <td>${t.laba || ''}</td>
      <td>${t.status || ''}</td>
      <td>${t.bukti || ''}</td>
    `;
    transactionList.appendChild(tr);
  });

  prevBtn.disabled = currentPage===1;
  nextBtn.disabled = currentPage>=Math.ceil(filteredTransactions.length/itemsPerPage);
}

let searchTimeout;
searchInput.addEventListener('input',()=>{
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(()=>{
    const query = searchInput.value.toLowerCase();
    filteredTransactions = transactions.filter(t =>
      (t.id?.toLowerCase().includes(query)) ||
      (t.provider?.toLowerCase().includes(query)) ||
      (t.produk?.toLowerCase().includes(query))
    );
    currentPage = 1;
    renderTransactions();
  },150);
});

prevBtn.addEventListener('click',()=>{
  if(currentPage>1){currentPage--;renderTransactions();}
});
nextBtn.addEventListener('click',()=>{
  if(currentPage<Math.ceil(filteredTransactions.length/itemsPerPage)){currentPage++;renderTransactions();}
});

window.addEventListener('pageshow', () => {
  loadingAnime.style.opacity = '0';
  loadingAnime.style.pointerEvents = 'none';
});

loadData();
</script>
</body>
</html>
